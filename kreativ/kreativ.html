<!DOCTYPE html>

<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Creative Archive — Danial Dawod</title>

  <style>
    :root {
      color-scheme: dark;

      --bg: #020503;
      --bg-soft: #050806;

      --green: #00ff66;
      --green-soft: #00b84a;

      --text: #effff4;
      --text-soft: rgba(223, 255, 240, .68);
      --text-muted: rgba(223, 255, 240, .38);

      --border: rgba(0, 255, 102, .14);
      --border-hover: rgba(0, 255, 102, .42);

      --font-mono:
        "Cascadia Code",
        "Cascadia Mono",
        Consolas,
        "Courier New",
        monospace;
    }

    * {
      box-sizing: border-box;
    }

    html {
      background: var(--bg);
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;

      background:
        radial-gradient(
          circle at 50% 0%,
          rgba(0, 255, 102, .045),
          transparent 38%
        ),
        linear-gradient(
          180deg,
          #020503 0%,
          #050806 50%,
          #020503 100%
        );

      color: var(--text);
      font-family: var(--font-mono);
    }

    /* =========================================================
       BACKGROUND
       ========================================================= */

    body::before {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 0;

      opacity: .17;

      background-image:
        linear-gradient(
          rgba(0, 255, 102, .035) 1px,
          transparent 1px
        ),
        linear-gradient(
          90deg,
          rgba(0, 255, 102, .035) 1px,
          transparent 1px
        );

      background-size: 48px 48px;

      mask-image:
        linear-gradient(
          to bottom,
          transparent,
          #000 12%,
          #000 88%,
          transparent
        );
    }

    body::after {
      content: "";

      position: fixed;
      inset: 0;

      pointer-events: none;
      z-index: 20;

      box-shadow:
        inset 0 0 180px 50px rgba(0, 0, 0, .9);
    }


    /* =========================================================
       HEADER
       ========================================================= */

    .site-header {
      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      height: 78px;

      z-index: 50;

      display: flex;
      align-items: center;

      padding:
        0
        clamp(1.2rem, 4vw, 4rem);

      background: rgba(0, 0, 0, .52);

      backdrop-filter: blur(12px);

      border-bottom:
        1px solid rgba(0, 255, 102, .13);
    }

    .nav-inner {
      width: 100%;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 2rem;
    }

    .nav-brand {
      color: var(--text);

      text-decoration: none;

      font-size: 1rem;
      font-weight: 700;

      letter-spacing: .02em;
    }

    .nav-brand span {
      color: var(--green);

      text-shadow:
        0 0 8px rgba(0, 255, 102, .7),
        0 0 22px rgba(0, 255, 102, .25);
    }

    .nav-back {
      color: var(--text-soft);

      text-decoration: none;

      font-size: .82rem;
      letter-spacing: .08em;

      transition:
        color .25s ease,
        text-shadow .25s ease;
    }

    .nav-back::before {
      content: "< ";

      color: var(--green);
    }

    .nav-back:hover {
      color: var(--green);

      text-shadow:
        0 0 10px rgba(0, 255, 102, .5);
    }


    /* =========================================================
       MAIN
       ========================================================= */

    main {
      position: relative;
      z-index: 2;

      width: min(1500px, 94vw);

      margin: 0 auto;

      padding:
        150px 0
        100px;
    }

    .page-heading {
      display: flex;

      justify-content: space-between;
      align-items: end;

      gap: 3rem;

      margin-bottom: 4.5rem;
    }

    .heading-kicker {
      margin: 0 0 .7rem;

      color: rgba(0, 255, 102, .62);

      font-size: .75rem;

      letter-spacing: .22em;

      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      color: var(--text);

      font-size:
        clamp(3rem, 8vw, 7rem);

      line-height: .88;

      letter-spacing: -.07em;

      text-shadow:
        0 0 16px rgba(0, 255, 102, .1),
        0 0 45px rgba(0, 255, 102, .045);
    }

    .heading-description {
      max-width: 38ch;

      margin: 0 0 .25rem;

      color: var(--text-soft);

      font-family: var(--font-mono);

      font-size: .9rem;

      line-height: 1.7;
    }


    /* =========================================================
       GALLERY
       ========================================================= */

    .gallery {
      columns: 4 260px;

      column-gap: 1rem;
    }

    .gallery-item {
      position: relative;

      display: block;

      width: 100%;

      margin: 0 0 1rem;

      padding: 0;

      border: 1px solid var(--border);

      background: #030704;

      cursor: pointer;

      overflow: hidden;

      break-inside: avoid;

      appearance: none;

      opacity: 0;

      transform: translateY(25px);

      animation:
        galleryReveal .7s
        cubic-bezier(.22, 1, .36, 1)
        forwards;

      transition:
        border-color .3s ease,
        box-shadow .3s ease,
        transform .35s cubic-bezier(.22, 1, .36, 1);
    }

    .gallery-item:nth-child(2) {
      animation-delay: .05s;
    }

    .gallery-item:nth-child(3) {
      animation-delay: .1s;
    }

    .gallery-item:nth-child(4) {
      animation-delay: .15s;
    }

    .gallery-item:nth-child(5) {
      animation-delay: .2s;
    }

    .gallery-item:nth-child(6) {
      animation-delay: .25s;
    }

    .gallery-item:nth-child(7) {
      animation-delay: .3s;
    }

    .gallery-item:nth-child(8) {
      animation-delay: .35s;
    }

    @keyframes galleryReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .gallery-item img {
      display: block;

      width: 100%;
      height: auto;

      object-fit: cover;

      transform: scale(1);

      transition:
        transform .7s
        cubic-bezier(.22, 1, .36, 1),
        filter .5s ease;
    }

    .gallery-item::after {
      content: "";

      position: absolute;
      inset: 0;

      pointer-events: none;

      background:
        linear-gradient(
          135deg,
          rgba(0, 255, 102, .12),
          transparent 30%,
          transparent 70%,
          rgba(0, 255, 102, .08)
        );

      opacity: 0;

      transition: opacity .4s ease;
    }

    .gallery-item:hover {
      border-color: var(--border-hover);

      box-shadow:
        0 0 0 1px rgba(0, 255, 102, .05),
        0 0 30px rgba(0, 255, 102, .09),
        0 18px 50px rgba(0, 0, 0, .4);

      transform: translateY(-3px);
    }

    .gallery-item:hover img {
      transform: scale(1.035);

      filter:
        brightness(1.06)
        saturate(1.04);
    }

    .gallery-item:hover::after {
      opacity: 1;
    }


    /* =========================================================
       IMAGE INFORMATION
       ========================================================= */

    .gallery-info {
      position: absolute;

      left: 0;
      right: 0;
      bottom: 0;

      padding:
        3rem 1rem 1rem;

      background:
        linear-gradient(
          to top,
          rgba(0, 0, 0, .8),
          rgba(0, 0, 0, .35),
          transparent
        );

      opacity: 0;

      transform: translateY(8px);

      transition:
        opacity .3s ease,
        transform .3s ease;
    }

    .gallery-item:hover .gallery-info {
      opacity: 1;
      transform: translateY(0);
    }

    .gallery-title {
      display: block;

      color: #effff4;

      font-size: .85rem;

      letter-spacing: .03em;
    }

    .gallery-number {
      display: block;

      margin-top: .3rem;

      color: var(--green);

      font-size: .68rem;

      letter-spacing: .12em;
    }


    /* =========================================================
       LIGHTBOX
       ========================================================= */

    .lightbox {
      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;
      justify-content: center;

      padding:
        clamp(1rem, 4vw, 4rem);

      background:
        rgba(0, 3, 1, .94);

      backdrop-filter: blur(18px);

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

      transition:
        opacity .35s ease,
        visibility .35s ease;
    }

    .lightbox.is-open {
      opacity: 1;

      visibility: visible;

      pointer-events: auto;
    }

    .lightbox::before {
      content: "";

      position: absolute;

      inset: 0;

      pointer-events: none;

      background:
        radial-gradient(
          circle at center,
          rgba(0, 255, 102, .045),
          transparent 55%
        );
    }

    .lightbox-content {
      position: relative;

      width: 100%;
      height: 100%;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .lightbox-image-wrap {
      position: relative;

      max-width: 90vw;
      max-height: 84vh;

      display: flex;

      align-items: center;
      justify-content: center;
    }

    .lightbox-image {
      display: block;

      max-width: 90vw;
      max-height: 84vh;

      width: auto;
      height: auto;

      object-fit: contain;

      border:
        1px solid rgba(0, 255, 102, .2);

      box-shadow:
        0 0 0 1px rgba(0, 255, 102, .025),
        0 0 60px rgba(0, 0, 0, .7),
        0 0 100px rgba(0, 255, 102, .04);

      user-select: none;

      animation:
        imageAppear .35s
        cubic-bezier(.22, 1, .36, 1);
    }

    @keyframes imageAppear {
      from {
        opacity: 0;
        transform: scale(.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }


    /* =========================================================
       LIGHTBOX UI
       ========================================================= */

    .lightbox-close {
      position: absolute;

      top: 1.5rem;
      right: 1.7rem;

      z-index: 5;

      width: 44px;
      height: 44px;

      border:
        1px solid rgba(0, 255, 102, .2);

      background:
        rgba(0, 10, 4, .65);

      color: var(--text-soft);

      font-family: var(--font-mono);

      font-size: 1.1rem;

      cursor: pointer;

      transition:
        color .25s ease,
        border-color .25s ease,
        box-shadow .25s ease;
    }

    .lightbox-close:hover {
      color: var(--green);

      border-color: rgba(0, 255, 102, .55);

      box-shadow:
        0 0 20px rgba(0, 255, 102, .12);
    }

    .lightbox-button {
      position: absolute;

      top: 50%;

      z-index: 5;

      width: 58px;
      height: 58px;

      transform: translateY(-50%);

      border:
        1px solid rgba(0, 255, 102, .16);

      background:
        rgba(0, 7, 3, .68);

      color: var(--text-soft);

      font-family: var(--font-mono);

      font-size: 1.4rem;

      cursor: pointer;

      transition:
        color .25s ease,
        border-color .25s ease,
        background .25s ease,
        box-shadow .25s ease;
    }

    .lightbox-button:hover {
      color: var(--green);

      border-color: rgba(0, 255, 102, .5);

      background:
        rgba(0, 15, 6, .8);

      box-shadow:
        0 0 25px rgba(0, 255, 102, .12);
    }

    .lightbox-prev {
      left: 1.5rem;
    }

    .lightbox-next {
      right: 1.5rem;
    }

    .lightbox-meta {
      position: absolute;

      left: 50%;
      bottom: 1.4rem;

      transform: translateX(-50%);

      display: flex;
      align-items: center;

      gap: 1rem;

      max-width: calc(100vw - 160px);

      text-align: center;

      white-space: nowrap;
    }

    .lightbox-counter {
      color: var(--green);

      font-size: .72rem;

      letter-spacing: .15em;
    }

    .lightbox-title {
      color: var(--text-soft);

      font-size: .78rem;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 1000px) {
      .gallery {
        columns: 3 220px;
      }
    }

    @media (max-width: 700px) {
      .site-header {
        height: 66px;
      }

      main {
        width: min(94vw, 620px);

        padding:
          115px 0
          70px;
      }

      .page-heading {
        display: block;

        margin-bottom: 3rem;
      }

      h1 {
        font-size: clamp(3.2rem, 17vw, 6rem);
      }

      .heading-description {
        margin-top: 1.5rem;
      }

      .gallery {
        columns: 2 150px;

        column-gap: .65rem;
      }

      .gallery-item {
        margin-bottom: .65rem;
      }

      .lightbox {
        padding: 1rem;
      }

      .lightbox-image {
        max-width: 94vw;
        max-height: 78vh;
      }

      .lightbox-button {
        width: 44px;
        height: 44px;

        top: auto;
        bottom: 4rem;

        transform: none;
      }

      .lightbox-prev {
        left: 1rem;
      }

      .lightbox-next {
        right: 1rem;
      }

      .lightbox-close {
        top: 1rem;
        right: 1rem;
      }

      .lightbox-meta {
        bottom: 1.2rem;

        max-width: 55vw;

        overflow: hidden;
      }

      .lightbox-title {
        overflow: hidden;

        text-overflow: ellipsis;
      }

      .gallery-info {
        display: none;
      }
    }

    @media (max-width: 430px) {
      .gallery {
        columns: 1;
      }

      .gallery-item {
        margin-bottom: .8rem;
      }

      .nav-back {
        font-size: .72rem;
      }
    }


    /* =========================================================
       REDUCED MOTION
       ========================================================= */

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;

        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;

        transition-duration: .01ms !important;
      }
    }
  </style>

</head>

  </div>

  <script>
    (() => {

      "use strict";


      /* =====================================================
         ELEMENTS
         ====================================================== */

      const gallery = document.getElementById("gallery");

      const items = [
        ...gallery.querySelectorAll(".gallery-item")
      ];

      const lightbox =
        document.getElementById("lightbox");

      const lightboxImage =
        document.getElementById("lightboxImage");

      const lightboxTitle =
        document.getElementById("lightboxTitle");

      const lightboxCounter =
        document.getElementById("lightboxCounter");

      const closeButton =
        document.getElementById("lightboxClose");

      const previousButton =
        document.getElementById("lightboxPrev");

      const nextButton =
        document.getElementById("lightboxNext");


      let currentIndex = 0;


      /* =====================================================
         TOUCH SWIPE
         ====================================================== */

      let touchStartX = 0;
      let touchStartY = 0;


      /* =====================================================
         OPEN
         ====================================================== */

      function openLightbox(index) {

        currentIndex = index;

        updateLightbox();

        lightbox.classList.add("is-open");

        lightbox.setAttribute(
          "aria-hidden",
          "false"
        );

        document.body.style.overflow = "hidden";

        closeButton.focus();
      }


      /* =====================================================
         CLOSE
         ====================================================== */

      function closeLightbox() {

        lightbox.classList.remove("is-open");

        lightbox.setAttribute(
          "aria-hidden",
          "true"
        );

        document.body.style.overflow = "";

        lightboxImage.src = "";
      }


      /* =====================================================
         UPDATE IMAGE
         ====================================================== */

      function updateLightbox() {

        const item = items[currentIndex];

        const image =
          item.querySelector("img");

        const title =
          item.dataset.title ||
          image.alt ||
          "Creative Work";


        /*
         * Bild austauschen.
         *
         * Durch das Entfernen und erneute
         * Hinzufügen der Animation bekommt
         * jedes neue Bild einen kleinen
         * Fade/Scale-Effekt.
         */

        lightboxImage.classList.remove(
          "lightbox-image"
        );

        void lightboxImage.offsetWidth;

        lightboxImage.classList.add(
          "lightbox-image"
        );

        lightboxImage.src = image.src;

        lightboxImage.alt = image.alt;

        lightboxTitle.textContent = title;


        lightboxCounter.textContent =
          `${String(currentIndex + 1).padStart(2, "0")} / ${String(items.length).padStart(2, "0")}`;
      }


      /* =====================================================
         NEXT
         ====================================================== */

      function showNext() {

        currentIndex =
          (currentIndex + 1) % items.length;

        updateLightbox();
      }


      /* =====================================================
         PREVIOUS
         ====================================================== */

      function showPrevious() {

        currentIndex =
          (currentIndex - 1 + items.length)
          % items.length;

        updateLightbox();
      }


      /* =====================================================
         GALLERY CLICK
         ====================================================== */

      items.forEach((item, index) => {

        item.addEventListener(
          "click",
          () => openLightbox(index)
        );

      });


      /* =====================================================
         BUTTONS
         ====================================================== */

      closeButton.addEventListener(
        "click",
        closeLightbox
      );

      previousButton.addEventListener(
        "click",
        showPrevious
      );

      nextButton.addEventListener(
        "click",
        showNext
      );


      /* =====================================================
         CLICK OUTSIDE IMAGE
         ====================================================== */

      lightbox.addEventListener(
        "click",
        event => {

          if (
            event.target === lightbox ||
            event.target.classList.contains(
              "lightbox-content"
            )
          ) {
            closeLightbox();
          }

        }
      );


      /* =====================================================
         KEYBOARD
         ====================================================== */

      document.addEventListener(
        "keydown",
        event => {

          if (
            !lightbox.classList.contains(
              "is-open"
            )
          ) {
            return;
          }


          switch (event.key) {

            case "Escape":
              closeLightbox();
              break;

            case "ArrowLeft":
              showPrevious();
              break;

            case "ArrowRight":
              showNext();
              break;

          }

        }
      );


      /* =====================================================
         TOUCH
         ====================================================== */

      lightbox.addEventListener(
        "touchstart",
        event => {

          const touch =
            event.changedTouches[0];

          touchStartX = touch.clientX;
          touchStartY = touch.clientY;

        },
        { passive: true }
      );


      lightbox.addEventListener(
        "touchend",
        event => {

          const touch =
            event.changedTouches[0];

          const deltaX =
            touch.clientX - touchStartX;

          const deltaY =
            touch.clientY - touchStartY;


          /*
           * Nur horizontale Swipes
           * berücksichtigen.
           */

          if (
            Math.abs(deltaX) > 50 &&
            Math.abs(deltaX) > Math.abs(deltaY)
          ) {

            if (deltaX < 0) {
              showNext();
            } else {
              showPrevious();
            }

          }

        },
        { passive: true }
      );


    })();
  </script>

</body>
</html>
